# Argo CD AppProject: what the Coliseum application may deploy and where. Least privilege at the GitOps level:
# one source repository, one destination namespace, only the resource kinds the chart renders.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: coliseum
  namespace: argocd
spec:
  description: Coliseum battle backend
  sourceRepos:
    - https://github.com/atorrellascz/coliseum.git
    - ghcr.io/atorrellascz/charts # released chart as an OCI artifact
  destinations:
    - namespace: coliseum
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: [] # nothing cluster-scoped
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
    - group: argoproj.io
      kind: Rollout
    - group: argoproj.io
      kind: AnalysisTemplate
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: external-secrets.io
      kind: ExternalSecret
