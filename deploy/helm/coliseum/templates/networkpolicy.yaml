{{- if .Values.monitoring.networkPolicy }}
# Least privilege on the wire: only the .NET hosts may talk to Redis; the API is reachable from anywhere in the
# cluster (ingress controller); the worker and MCP accept only probes/scrapes on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coliseum.fullname" . }}-redis
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "coliseum.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [{{ .Release.Name | quote }}]
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker]
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coliseum.fullname" . }}-hosts
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker, mcp]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
{{- end }}
