{{- if .Values.redis.embedded }}
{{- $labels := dict "root" . "component" "redis" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coliseum.fullname" . }}-redis
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    {{- include "coliseum.selectorLabels" $labels | nindent 4 }}
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coliseum.fullname" . }}-redis
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "coliseum.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "coliseum.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coliseum.selectorLabels" $labels | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # noeviction protects settlement idempotency (SUP-10); AOF keeps the stream and balances across restarts.
          args: ["--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
{{- end }}
