{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coliseum.secretName" . }}
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
type: Opaque
stringData:
  signingKey: {{ required "secrets.signingKey is required (32+ chars)" .Values.secrets.signingKey | quote }}
  apiKey: {{ required "secrets.apiKey is required" .Values.secrets.apiKey | quote }}
  mcpClientKey: {{ .Values.secrets.mcpClientKey | quote }}
{{- end }}
