{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "coliseum.fullname" . }}
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "coliseum.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "coliseum.fullname" . }}
  labels:
    {{- include "coliseum.labels" . | nindent 4 }}
spec:
  groups:
    - name: coliseum.slo
      rules:
        - alert: ColiseumApiErrorBudgetBurn
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="coliseum-api",http_response_status_code=~"5.."}[5m]))
              / sum(rate(http_server_request_duration_seconds_count{service_name="coliseum-api"}[5m])) > 0.0144
          for: 5m
          labels: { severity: page }
          annotations: { summary: "API 5xx ratio burning the 99.9% budget at 14.4x" }
        - alert: ColiseumQueueStalled
          expr: max(coliseum_queue_pending) > 0 and sum(rate(coliseum_battles_processed_total[5m])) == 0
          for: 2m
          labels: { severity: page }
          annotations: { summary: "Pending battles but nothing processed for 2 minutes (worker stuck?)" }
        - alert: ColiseumDeadLetterGrowing
          expr: increase(coliseum_dlq_length[10m]) > 0
          labels: { severity: ticket }
          annotations: { summary: "Poison messages are landing in the dead-letter stream" }
        - alert: ColiseumQueueLatencyHigh
          expr: histogram_quantile(0.95, sum by (le) (rate(coliseum_battle_queue_latency_seconds_bucket[5m]))) > 2
          for: 10m
          labels: { severity: page }
          annotations: { summary: "p95 submission-to-settlement above 2 s" }
{{- end }}
