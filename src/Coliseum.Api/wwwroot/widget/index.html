<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coliseum widget demo</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <!-- Demo host page for the embeddable widget. Paste a PLAYER token (from POST /players or the arena tab's sessionStorage). -->
  <h1>Coliseum widget demo</h1>
  <p>Any page can embed a live leaderboard and battle feed with one script tag. Paste a <b>player</b> token below
    (least privilege: it sees the public leaderboard and its own battles, and expires in an hour).</p>
  <label>Player token <input id="token" placeholder="eyJ..." autocomplete="off"></label>
  <button id="mount">Mount widget</button>
  <pre id="snippet" class="snippet"></pre>
  <div id="host"></div>
  <script src="demo.js"></script>
</body>
</html>
